<style>
  :root{
    --cream:#F7F0E5;
    --cream-panel:#FBF7EE;
    --paper:#EFE4D2;
    --ink:#2E1B0C;
    --ink-soft:#6B5645;
    --cork-light:#E4D3B8;
    --wine:#6E2A2A;
    --line: rgba(46,27,12,0.16);
    --line-strong: rgba(46,27,12,0.28);
    --radius: 3px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }
  .wrap{
    max-width:480px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  .logo{ width:64px; height:64px; border-radius:50%; object-fit:cover; }
  .code{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-style:italic;
    font-size:15px;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin:0;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(28px, 5vw, 38px);
    line-height:1.15;
    margin:0;
  }
  p.lede{
    margin:0;
    font-size:16px;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:38ch;
  }
  .btn-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:13px 26px; border-radius:var(--radius);
    font-size:15px; font-weight:600; text-decoration:none;
    transition:opacity .15s ease;
  }
  .btn-primary{ background:var(--ink); color:var(--cream-panel); }
  .btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--line-strong); }
  .btn:hover{ opacity:.82; }
  .cork-rule{
    width:64px; height:1px;
    background:var(--line-strong);
    margin:2px 0;
  }
  :focus-visible{ outline:2px solid var(--wine); outline-offset:2px; }
</style>
</head>
